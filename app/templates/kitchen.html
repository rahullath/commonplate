<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E7A45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="manifest" href="/kitchen.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="icon" href="/static/icons/icon-192.png">
<title>Kitchen</title>
<style>
:root {
  --g: #0E7A45; --g-soft: #E4F0E6; --amber: #9A5A06; --amber-soft: #FBF0DE;
  --red: #A8321F; --red-soft: #FBE6E1; --blue: #1B5FA8; --blue-soft: #E7F0FA;
  --bg: #F6F3EC; --card: #fff; --line: #E7E1D6; --ink: #171A14; --sub: #5F645A;
}
* { box-sizing: border-box; }
html, body { margin: 0; -webkit-tap-highlight-color: transparent; }
body { font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
button, input { font: inherit; }
a { color: inherit; }
.app { max-width: 600px; margin: 0 auto; min-height: 100dvh; }

/* header */
.top { position: sticky; top: 0; z-index: 10; background: var(--g); color: #fff; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 0; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.top h1 { margin: 0; font-size: 23px; }
.top .sum { font-size: 15px; opacity: .92; margin-top: 2px; }
.sound { border: 2px solid rgba(255,255,255,.7); background: transparent; color: #fff; border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.sound.on { background: #fff; color: var(--g); border-color: #fff; }
.tabs { display: flex; gap: 4px; margin-top: 12px; }
.tabs button { flex: 1; border: 0; background: transparent; color: rgba(255,255,255,.8); padding: 11px 4px 12px; font-size: 16px; font-weight: 600; border-bottom: 4px solid transparent; }
.tabs button.on { color: #fff; border-bottom-color: #fff; }
.tabs .n { display: inline-block; min-width: 22px; padding: 0 6px; border-radius: 999px; background: rgba(255,255,255,.22); font-size: 13px; margin-left: 4px; }
.tabs button.on .n { background: #fff; color: var(--g); }

.banner { margin: 12px 16px 0; padding: 12px 14px; border-radius: 12px; background: var(--amber-soft); color: var(--amber); font-weight: 600; border: 0; width: calc(100% - 32px); text-align: left; }

.list { display: grid; gap: 16px; padding: 16px; }
.empty { text-align: center; color: var(--sub); padding: 70px 20px; font-size: 18px; }

/* order card */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; border-top: 8px solid var(--line); }
.card.s-new { border-top-color: #E0A030; }
.card.s-preparing { border-top-color: var(--g); }
.card.s-ready { border-top-color: var(--blue); }
.card.s-out_for_delivery { border-top-color: #7A7F72; }
.card.flash { animation: flash 1.2s ease 3; }
@keyframes flash { 50% { box-shadow: 0 0 0 6px #E0A030; } }
.sec { padding: 14px 16px; border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; }
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.oid { font-size: 28px; font-weight: 800; line-height: 1.1; }
.when { color: var(--sub); font-size: 15px; margin-top: 3px; }
.pills { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.pill { font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.p-new { background: var(--amber-soft); color: var(--amber); }
.p-preparing { background: var(--g-soft); color: var(--g); }
.p-ready { background: var(--blue-soft); color: var(--blue); }
.p-out_for_delivery, .p-delivered { background: #EEECE6; color: var(--sub); }
.p-cancelled { background: var(--red-soft); color: var(--red); }
.p-type { background: var(--ink); color: #fff; }
.later { margin-top: 8px; display: inline-block; background: var(--blue-soft); color: var(--blue); font-weight: 700; padding: 6px 10px; border-radius: 8px; font-size: 15px; }

.cust { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cust b { font-size: 19px; }
.cust .ph { color: var(--sub); font-size: 15px; }
.cbtns { display: flex; gap: 8px; }
.cbtns a { text-decoration: none; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-weight: 600; font-size: 15px; background: #fff; }

.items { margin: 0; padding: 0; list-style: none; font-size: 21px; line-height: 1.5; }
.items li { display: flex; gap: 10px; }
.items .q { font-weight: 800; min-width: 38px; }
.note { margin-top: 10px; background: var(--amber-soft); border-radius: 10px; padding: 10px 12px; font-size: 17px; }

h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--sub); }
.bill { display: grid; gap: 3px; font-size: 16px; font-variant-numeric: tabular-nums; }
.bill div { display: flex; justify-content: space-between; gap: 10px; }
.bill .tot { font-weight: 800; font-size: 19px; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 4px; }
.bill .minus { color: var(--g); }
.paybox { margin-top: 10px; border-radius: 12px; padding: 11px 13px; font-weight: 700; font-size: 17px; }
.paybox.ok { background: var(--g-soft); color: var(--g); }
.paybox.wait { background: var(--blue-soft); color: var(--blue); }
.paybox.cash { background: var(--amber-soft); color: var(--amber); }
.paybox small { display: block; font-weight: 500; font-size: 14px; margin-top: 2px; }
.split { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.split div { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.split span { display: block; font-size: 12px; color: var(--sub); line-height: 1.25; }
.split b { font-size: 17px; font-variant-numeric: tabular-nums; }

.addr { font-size: 17px; }
.flag { margin-top: 8px; background: var(--red-soft); color: var(--red); border-radius: 10px; padding: 10px 12px; font-size: 15px; font-weight: 600; }
.porter ol { margin: 0; padding-left: 22px; display: grid; gap: 10px; }
.porter li { padding-left: 2px; }
.copyrow { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; margin-top: 3px; }
.copyrow span { min-width: 0; overflow-wrap: anywhere; }
.copy { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; font-size: 14px; font-weight: 600; }
.copy.done { background: var(--g-soft); color: var(--g); border-color: var(--g-soft); }
.maplink { display: inline-block; margin-top: 4px; font-weight: 600; color: var(--blue); }
.field { margin-top: 12px; display: grid; gap: 6px; }
.field label { font-size: 15px; font-weight: 600; }
.field input { width: 100%; padding: 13px; border: 1.5px solid var(--line); border-radius: 10px; font-size: 17px; background: #fff; }
.hint { font-size: 14px; color: var(--sub); }

.act { padding: 14px 16px 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.big { width: 100%; border: 0; border-radius: 14px; padding: 19px; font-size: 20px; font-weight: 800; color: #fff; background: var(--g); }
.big.blue { background: var(--blue); }
.big:disabled { opacity: .55; }
.ghost { width: 100%; border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 600; }
.tells { font-size: 14px; color: var(--sub); text-align: center; }
.minor { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 15px; }
.minor a, .minor button { color: var(--sub); background: none; border: 0; padding: 4px 0; text-decoration: underline; }
.minor .danger { color: var(--red); }
.rider { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 15px; overflow-wrap: anywhere; }

/* login */
.login { padding: 60px 24px; display: grid; gap: 14px; }
.login h1 { margin: 0; font-size: 28px; }
.login input { padding: 15px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 18px; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 14px 20px; border-radius: 999px; font-weight: 600; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .card.flash { animation: none; } }

/* clarity pass */
.nx-wrap { display: grid; gap: 12px; background: #FCFBF7; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stp { text-align: center; font-size: 12.5px; color: var(--sub); line-height: 1.25; }
.stp i { display: flex; width: 28px; height: 28px; margin: 0 auto 4px; border-radius: 50%; align-items: center; justify-content: center; font-style: normal; font-weight: 800; background: #E6E1D6; color: var(--sub); }
.stp.done i { background: var(--g); color: #fff; }
.stp.now i { background: #fff; color: var(--g); box-shadow: 0 0 0 3px var(--g); }
.stp.now { color: var(--ink); font-weight: 700; }
.paynow { border: 3px solid #E0A030; background: #FFF6E3; border-radius: 16px; padding: 14px; }
.pn-k { font-size: 13px; font-weight: 800; letter-spacing: .05em; color: var(--amber); }
.pn-t { font-size: 22px; font-weight: 800; margin-top: 4px; line-height: 1.2; }
.pn-s { font-size: 15.5px; margin: 6px 0 10px; color: #4A3A12; }
.big.pay { background: #1B7F3B; font-size: 21px; }
.banner.pay { background: #E0A030; color: #2B1D00; font-size: 18px; font-weight: 800; position: sticky; top: 0; z-index: 9; }
.next { border: 2px solid var(--line); border-radius: 16px; padding: 14px; background: #fff; display: grid; gap: 10px; }
.next.warnbox { border-color: var(--blue); background: var(--blue-soft); }
.nx-k { font-size: 13px; font-weight: 800; letter-spacing: .06em; color: var(--sub); }
.nx-t { font-size: 20px; font-weight: 800; line-height: 1.25; }
.warn { background: #fff; border: 2px dashed var(--blue); border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 16px; color: var(--blue); }
.big.sure { background: #111; }
.how { font-size: 15.5px; background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.openapps { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.openapp { text-align: center; text-decoration: none; background: var(--ink); color: #fff; border-radius: 12px; padding: 14px 8px; font-weight: 800; font-size: 17px; }
.step-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.sr-l { grid-column: 1 / -1; font-size: 13px; font-weight: 800; letter-spacing: .03em; color: var(--sub); white-space: pre; }
.sr-v { font-size: 16.5px; overflow-wrap: anywhere; }
.step-row .copy { background: var(--g); color: #fff; border: 0; min-height: 46px; padding: 0 14px; font-size: 15px; border-radius: 12px; }
.step-row .copy.done { background: var(--g-soft); color: var(--g); }
.porter ol { display: none; }

/* multi-order: dark base, one big card, everything else one line */
:root { --dark: #171A14; --dark2: #2A2E26; --dim: #C9CCC3; --amberbar: #E8A33D; }
body { background: var(--dark); color: #fff; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.top { background: var(--dark); border-bottom: 1px solid #2A2E26; padding-bottom: 12px; }
.top-row { gap: 10px; }
.clock { font: 700 15px/1 ui-monospace, Menlo, monospace; letter-spacing: .04em; color: var(--dim); min-width: 74px; }
.on { flex: 1; text-align: right; font-weight: 600; font-size: 15px; color: var(--dim); }
.ttl { flex: 1; font-weight: 800; font-size: 19px; }
.back { border: 0; background: transparent; color: var(--dim); font-size: 34px; line-height: 1; min-width: 44px; min-height: 44px; padding: 0; }
.sound { border-color: #555; font-size: 20px; padding: 6px 10px; min-width: 48px; min-height: 44px; }
.sound.on { background: transparent; color: #fff; border-color: var(--amberbar); }
.banner { margin-top: 10px; }
.empty { color: var(--dim); }
.list { padding: 12px 16px 16px; }
.list .card { color: var(--ink); }
.home { padding: 6px 16px 16px; }
.lane { margin: 18px 0 10px; font: 800 14px/1 ui-monospace, Menlo, monospace; letter-spacing: .08em; color: var(--amberbar); }
.lane.dim { color: #8A8F84; margin-top: 26px; }
.nu { background: var(--bg); color: var(--ink); border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 4px var(--ring, var(--amberbar)); }
.nu-h { padding: 12px 18px; display: flex; justify-content: space-between; font: 800 14px/1 ui-monospace, Menlo, monospace; color: #fff; }
.nu-b { padding: 16px 18px 18px; display: grid; gap: 12px; }
.nu-items { font-size: 30px; line-height: 1.2; font-weight: 800; }
.nu-note { padding: 12px 14px; border-radius: 12px; background: #FFF1C9; font-size: 18px; font-weight: 600; }
.nu-meta { font-size: 15px; color: var(--sub); }
.nu .next { padding: 0; border: 0; background: transparent; }
.nu .next.warnbox { background: var(--blue-soft); padding: 12px; border: 2px solid var(--blue); }
.more { border: 0; background: none; color: var(--sub); text-decoration: underline; font-size: 15px; min-height: 44px; text-align: center; }
.rows { display: grid; gap: 10px; }
.rowc { width: 100%; text-align: left; background: var(--dark2); color: #fff; border: 0; border-radius: 16px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 64px; }
.rc-t { font-weight: 800; font-size: 19px; line-height: 1.2; }
.rc-s { margin-top: 5px; font-size: 14px; color: var(--dim); }
.rc-time { font: 700 14px/1 ui-monospace, Menlo, monospace; color: var(--dim); white-space: nowrap; }
.rc-time.soon { color: var(--amberbar); }
.more-rows { justify-content: center; color: var(--dim); font-weight: 700; }
.paystrip { width: 100%; margin-top: 10px; border: 0; background: var(--amberbar); color: #2B1D00; font-weight: 800; font-size: 15px; border-radius: 14px; padding: 12px 14px; min-height: 48px; text-align: left; }
.bbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; background: var(--dark); border-top: 1px solid #2A2E26; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; max-width: 600px; margin: 0 auto; }
.bbar.four { grid-template-columns: repeat(4, 1fr); }
.bbar.four button { font-size: 14px; padding: 0 2px; }
.bbar button.shut { background: #7A2417; }
.shutstrip { width: 100%; margin-top: 10px; border: 0; background: #7A2417; color: #fff; font-weight: 800; font-size: 15px; border-radius: 14px; padding: 12px 14px; min-height: 48px; text-align: left; }
.shop { padding-bottom: 110px; }
.sh-state { font-size: 20px; font-weight: 800; margin: 4px 0 10px; }
.sh-sub { color: var(--dim); font-size: 14px; margin: 6px 0 12px; }
.sh-card { background: var(--dark2); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.sh-in { width: 100%; border: 1px solid #3A3F36; background: #1E211B; color: #fff; border-radius: 12px; padding: 14px; font-size: 17px; }
.sh-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.sh-b { border: 0; border-radius: 14px; background: var(--dark2); color: #fff; padding: 15px 8px; font-size: 16px; font-weight: 700; min-height: 56px; }
.sh-chk { display: flex; align-items: center; gap: 10px; font-size: 16px; }
.sh-chk input { width: 22px; height: 22px; }
.sh-list { margin-top: 10px; display: grid; gap: 8px; }
.sh-row { display: flex; align-items: center; gap: 8px; background: var(--dark2); border-radius: 14px; padding: 10px 12px; }
.sh-row.off { opacity: .7; }
.sh-n { flex: 1; font-weight: 700; min-width: 0; }
.sh-n span { display: block; color: var(--dim); font-weight: 500; font-size: 13px; }
.sh-t { border: 0; border-radius: 999px; padding: 10px 14px; font-weight: 800; font-size: 14px; min-width: 88px; min-height: 44px; }
.sh-t.on { background: #1B7F3B; color: #fff; }
.sh-t.so { background: #7A2417; color: #fff; }
.sh-x { border: 1px solid #5A5F55; background: transparent; color: #fff; border-radius: 999px; padding: 8px 10px; font-size: 13px; min-height: 40px; }
.sh-p { border: 1px solid #5A5F55; background: transparent; color: #fff; border-radius: 999px; padding: 10px 12px; font-weight: 800; font-size: 15px; min-height: 44px; white-space: nowrap; }
.chg { color: var(--amberbar); }
.sh-edit { background: var(--dark2); border-radius: 14px; padding: 14px; display: grid; gap: 10px; border: 2px solid var(--amberbar); }
.sh-l { display: grid; gap: 6px; font-size: 14px; color: var(--dim); }
.sh-b.save { background: #1B7F3B; }
.sh-x.wide { width: 100%; min-height: 48px; font-size: 15px; }
.sh-ch { padding: 6px 0; font-size: 15px; border-top: 1px solid #3A3F36; }
.sh-ch:first-child { border-top: 0; }
.sh-ch span { display: block; color: var(--dim); font-size: 12px; }
.sh-link { display: block; background: var(--dark2); border-radius: 14px; padding: 16px; color: #fff; text-decoration: none; font-weight: 700; }
.bbar button { height: 52px; border: 0; border-radius: 14px; background: var(--dark2); color: #fff; font-size: 16px; font-weight: 700; }
.newban { position: sticky; top: 0; z-index: 14; margin: 10px 12px 0; background: var(--amberbar); color: var(--ink); border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 28px rgba(0,0,0,.45); }
.nb-t { flex: 1; min-width: 0; }
.nb-k { font: 800 13px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .04em; }
.nb-i { margin-top: 5px; font-weight: 800; font-size: 17px; line-height: 1.2; }
.nb-b { min-height: 48px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--ink); color: #fff; font-size: 17px; font-weight: 800; }
.tg-h { font-size: 15px; color: var(--dim); margin: 8px 0 14px; }
.tg { display: block; width: 100%; text-align: left; background: var(--bg); color: var(--ink); border: 0; border-radius: 20px; padding: 18px; margin-bottom: 12px; }
.tg.done { opacity: .5; }
.tg.done .tg-n { text-decoration: line-through; }
.tg-top { display: flex; align-items: center; gap: 12px; }
.tg-q { font-weight: 800; font-size: 44px; line-height: 1; }
.tg-n { flex: 1; font-weight: 800; font-size: 26px; line-height: 1.1; }
.tg-c { font-size: 30px; color: var(--g); }
.tg-chips { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 12px; border-radius: 10px; background: #E7F1EA; font: 700 13px/1 ui-monospace, Menlo, monospace; }
.chip.flagnote { background: #FFF1C9; }
.sound.off { background: var(--amberbar); color: #2B1D00; border-color: var(--amberbar); font-size: 13px; font-weight: 800; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="/static/kitchen.js?v=6"></script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function () {});
</script>
</body>
</html>
