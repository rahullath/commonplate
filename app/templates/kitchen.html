<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FAF7F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kitchen">
<link rel="manifest" href="/kitchen.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=IBM+Plex+Sans:wght@500;600;700;800&display=swap">
<title>Kitchen</title>
<style>
:root {
  --paper: #FAF7F0; --card: #fff; --ink: #14170F; --muted: #4A4F44; --line: #D9D2C3;
  --green: #0B6B3A; --green-soft: #E0F1E6; --amber-bg: #FFE3A0; --amber-ink: #4A2F00; --amber: #8A4B00;
  --blue: #0F4C9A; --blue-soft: #E3ECF8; --red: #B3261E; --red-soft: #FBE3E0; --grey: #3E4339;
}
* { box-sizing: border-box; }
html, body { margin: 0; -webkit-tap-highlight-color: transparent; }
body { font: 500 18px/1.4 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--paper); color: var(--ink);
  padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
button, input { font: inherit; }
a { color: inherit; }
h1, h2, .ttl, .oid { font-family: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif; font-weight: 800; }
.app { max-width: 600px; margin: 0 auto; min-height: 100dvh; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* top */
.top { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 2px solid var(--line); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; display: flex; align-items: center; gap: 12px; min-height: 68px; }
.top .ttl { flex: 1; font-size: 26px; line-height: 1.1; }
.back { flex: none; min-width: 96px; height: 56px; border: 2px solid var(--ink); background: #fff; border-radius: 16px; font-size: 20px; font-weight: 800; }
.sound { flex: none; min-width: 56px; height: 56px; border: 2px solid var(--line); background: #fff; border-radius: 16px; font-size: 22px; padding: 0 12px; }
.sound.off { background: var(--amber-bg); color: var(--amber-ink); border-color: var(--amber); font-size: 16px; font-weight: 800; }
.conn { padding: 8px 16px; font-size: 15px; font-weight: 700; color: var(--muted); background: #F1ECDF; }
.conn.bad { background: var(--red); color: #fff; font-size: 17px; }

/* new-order banner: lives outside the re-rendered view */
#banner { position: sticky; top: 0; z-index: 14; }
.newban { margin: 10px 12px 0; background: var(--amber-bg); color: var(--amber-ink); border: 3px solid var(--amber); border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.nb-t { flex: 1; min-width: 0; }
.nb-k { font-weight: 800; font-size: 16px; }
.nb-i { margin-top: 4px; font-weight: 700; font-size: 18px; line-height: 1.25; }
.nb-b { min-height: 60px; padding: 0 22px; border: 0; border-radius: 16px; background: var(--green); color: #fff; font-size: 20px; font-weight: 800; }

.list { display: grid; gap: 14px; padding: 14px 16px; }
.empty { text-align: center; color: var(--muted); padding: 70px 20px; font-size: 20px; }
.lane { margin: 10px 0 0; font-weight: 800; font-size: 17px; color: var(--muted); }

/* order list rows */
.ocard { display: block; width: 100%; text-align: left; background: var(--card); color: var(--ink); border: 2px solid var(--line); border-left-width: 10px; border-radius: 18px; padding: 14px 16px; min-height: 68px; }
.ocard.new { border-left-color: var(--amber); } .ocard.preparing { border-left-color: var(--green); }
.ocard.ready { border-left-color: var(--blue); } .ocard.out_for_delivery { border-left-color: var(--grey); }
.oc-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.oc-id { font: 800 24px/1.1 "Bricolage Grotesque", system-ui, sans-serif; }
.oc-st { font-weight: 800; font-size: 18px; }
.oc-st.new { color: var(--amber); } .oc-st.preparing { color: var(--green); } .oc-st.ready { color: var(--blue); } .oc-st.out_for_delivery { color: var(--grey); }
.oc-i { margin-top: 6px; font-size: 22px; line-height: 1.3; font-weight: 700; }
.oc-m { margin-top: 6px; font-size: 17px; color: var(--muted); }
.chipwarn { display: inline-block; margin-top: 8px; background: var(--amber-bg); color: var(--amber-ink); border-radius: 10px; padding: 6px 10px; font-weight: 800; font-size: 16px; }
.strip { display: block; width: 100%; text-align: left; border: 0; border-radius: 16px; padding: 14px 16px; min-height: 56px; font-weight: 800; font-size: 18px; }
.strip.amber { background: var(--amber-bg); color: var(--amber-ink); }
.strip.red { background: var(--red); color: #fff; }

/* order page */
.page { padding: 14px 16px; display: grid; gap: 14px; }
.box { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.box h3 { margin: 0; font: 800 20px/1.2 "Bricolage Grotesque", system-ui, sans-serif; }
.status { font: 800 30px/1.1 "Bricolage Grotesque", system-ui, sans-serif; }
.status.new { color: var(--amber); } .status.preparing { color: var(--green); } .status.ready { color: var(--blue); } .status.out_for_delivery, .status.delivered { color: var(--grey); } .status.cancelled { color: var(--red); }
.when { color: var(--muted); font-size: 17px; }
.items { margin: 0; padding: 0; list-style: none; font-size: 24px; line-height: 1.35; font-weight: 700; }
.items li { display: flex; gap: 10px; } .items .q { min-width: 44px; font-weight: 800; }
.note { background: var(--amber-bg); color: var(--amber-ink); border-radius: 12px; padding: 12px 14px; font-size: 19px; font-weight: 700; }
.money { font-size: 20px; font-weight: 800; }
.money.ok { color: var(--green); }
.cust { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.cust b { font-size: 21px; } .cust .ph { color: var(--muted); font-size: 17px; }
.cbtns { display: flex; gap: 8px; }
.cbtns a { text-decoration: none; border: 2px solid var(--line); border-radius: 14px; padding: 0 14px; min-height: 56px; display: inline-flex; align-items: center; font-weight: 800; font-size: 17px; background: #fff; }

.big { width: 100%; min-height: 64px; border: 0; border-radius: 16px; padding: 14px; font-size: 21px; font-weight: 800; color: #fff; background: var(--green); }
.big.blue { background: var(--blue); } .big.amber { background: var(--amber); } .big.ghost { background: #fff; color: var(--ink); border: 2px solid var(--ink); }
.big.red { background: var(--red); }
.big:disabled { opacity: .5; }
.btn { min-height: 56px; border: 2px solid var(--ink); background: #fff; color: var(--ink); border-radius: 14px; padding: 0 18px; font-size: 19px; font-weight: 800; }
.tells { font-size: 16px; color: var(--muted); text-align: center; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 17px; min-height: 56px; font-weight: 700; }
.linkbtn.red { color: var(--red); }
.flag { background: var(--red-soft); color: var(--red); border-radius: 12px; padding: 12px 14px; font-size: 17px; font-weight: 700; }
.good { background: var(--green-soft); color: var(--green); border-radius: 12px; padding: 12px 14px; font-size: 17px; font-weight: 700; }
.warnc { background: var(--amber-bg); color: var(--amber-ink); border: 2px solid var(--amber); border-radius: 12px; padding: 12px 14px; font-size: 17px; font-weight: 700; }

/* payment card */
.paycard { border: 3px solid var(--amber); background: #FFF6E3; }
.paycard .q { font: 800 24px/1.2 "Bricolage Grotesque", system-ui, sans-serif; }
.paycard .s { font-size: 17px; color: var(--amber-ink); }

/* rider steps */
.step { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.step .n { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 800; font-size: 22px; display: flex; align-items: center; justify-content: center; }
.step .t { font-size: 20px; font-weight: 800; line-height: 1.25; margin-top: 2px; }
.step .d { font-size: 17px; color: var(--muted); margin-top: 4px; }
.drop { font-size: 22px; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
.field { display: grid; gap: 6px; }
.field label { font-size: 17px; font-weight: 800; }
.field input, .in { width: 100%; min-height: 56px; padding: 12px 14px; border: 2px solid var(--ink); border-radius: 14px; font-size: 19px; background: #fff; color: var(--ink); }
.found { font-weight: 800; font-size: 17px; }
.found.ok { color: var(--green); } .found.unknown { color: var(--amber); } .found.bad { color: var(--red); }

/* tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; max-width: 600px; margin: 0 auto; background: var(--paper); border-top: 2px solid var(--line); padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tabs button { height: 68px; border: 2px solid var(--ink); border-radius: 16px; background: #fff; color: var(--ink); font-size: 18px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.tabs button svg { width: 26px; height: 26px; }
.tabs button.on { background: var(--ink); color: #fff; }
.tabs button .dot { display: inline-block; min-width: 24px; padding: 0 7px; border-radius: 999px; background: var(--amber-bg); color: var(--amber-ink); font-size: 15px; margin-left: 4px; }
.tabs button.shut { border-color: var(--red); }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(20,23,15,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 600px; background: var(--paper); border-radius: 24px 24px 0 0; padding: 22px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.sheet h2 { margin: 0; font-size: 26px; line-height: 1.2; }
.sheet p { margin: 0; font-size: 18px; color: var(--muted); }

/* menu + shop */
.search { width: calc(100% - 32px); margin: 14px 16px 0; }
.dish { display: flex; align-items: center; gap: 12px; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 10px 12px; }
.dish.off { opacity: .65; }
.thumb { flex: none; width: 64px; height: 64px; border-radius: 14px; border: 1px solid var(--line); object-fit: cover; background: #F1ECDF; }
.thumb.none { border: 2px dashed #8A8F84; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); text-align: center; font-weight: 700; }
.dn { flex: 1; min-width: 0; font-weight: 800; font-size: 19px; line-height: 1.2; }
.dn span { display: block; font-weight: 600; font-size: 15px; color: var(--muted); }
.price { flex: none; min-height: 56px; border: 2px solid var(--ink); background: #fff; border-radius: 14px; padding: 0 12px; font-weight: 800; font-size: 18px; }
.tog { flex: none; min-width: 92px; min-height: 56px; border: 0; border-radius: 999px; font-weight: 800; font-size: 17px; color: #fff; }
.tog.on { background: var(--green); } .tog.so { background: var(--red); }
.shop-state { font: 800 28px/1.2 "Bricolage Grotesque", system-ui, sans-serif; }
.shop-state.on { color: var(--green); } .shop-state.off { color: var(--red); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chg { padding: 8px 0; font-size: 17px; border-top: 1px solid var(--line); } .chg:first-child { border-top: 0; }
.chg span { display: block; color: var(--muted); font-size: 14px; }
.sh-link { display: block; background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 18px 16px; text-decoration: none; font-weight: 800; font-size: 18px; }
.login { padding: 60px 24px; display: grid; gap: 14px; } .login h1 { margin: 0; font-size: 32px; }
.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 14px 20px; border-radius: 999px; font-weight: 700; z-index: 50; max-width: calc(100% - 32px); text-align: center; font-size: 18px; }
</style>
</head>
<body>
<div id="banner"></div>
<div class="app" id="app"></div>
<script src="/static/kitchen.js?v=7"></script>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(function () {});
</script>
</body>
</html>
